[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-system"
version = "0.1.0"
description = "Multi-model autonomous coding agent system with cloud LLM providers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Agent System Team", email = "team@example.com"}
]
keywords = ["agents", "llm", "autonomous", "coding", "multi-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    
    # HTTP clients for providers
    "httpx>=0.27",
    "openai>=1.30",
    "google-generativeai>=0.7",
    
    # Database
    "aiosqlite>=0.19",
    "sqlalchemy>=2.0",
    
    # Async
    "anyio>=4.0",
    
    # CLI
    "click>=8.1",
    "rich>=13.7",
    
    # Tools
    "gitpython>=3.1",
    "playwright>=1.40",
    "aiofiles>=23.2",
    
    # Security
    "semgrep>=1.70",
    
    # Observability
    "structlog>=24.1",
    
    # Utilities
    "tenacity>=8.2",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.13",
    "ruff>=0.5",
    "mypy>=1.9",
    "pre-commit>=3.6",
]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.13",
    "respx>=0.22",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.4",
    "mkdocstrings[python]>=1.13",
]

[project.scripts]
agent-system = "agent_system.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TID", "ARG", "PTH", "ERA", "PL", "TRY"
]
ignore = ["S101", "TRY003"]
per-file-ignores = [
    { pattern = "tests/*", ignore = ["S101", "PLR2004", "ERA001"] }
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_system*"]